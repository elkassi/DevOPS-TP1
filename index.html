<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Daily Tasks</title>
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body>
  <main class="app">
    <header>
      <span class="eyebrow">A LITTLE SPACE TO FOCUS</span>
      <h1>Daily Tasks<span>.</span></h1>
      <p>Keep the important things in one simple place.</p>
    </header>
    <section class="panel" aria-label="Task list">
      <form id="task-form">
        <label class="sr-only" for="task-input">New task</label>
        <input id="task-input" name="task" type="text" maxlength="120" placeholder="What needs to get done?" autocomplete="off" required>
        <button class="add" type="submit">Add task <span aria-hidden="true">+</span></button>
      </form>
      <div class="toolbar">
        <div class="filters" role="group" aria-label="Filter tasks">
          <button type="button" data-filter="all" class="filter active" aria-pressed="true">All</button>
          <button type="button" data-filter="active" class="filter" aria-pressed="false">Active</button>
          <button type="button" data-filter="completed" class="filter" aria-pressed="false">Completed</button>
        </div>
        <span id="task-count" aria-live="polite"></span>
      </div>
      <ul id="task-list" aria-label="Tasks"></ul>
      <p id="empty-state" class="empty-state" hidden></p>
      <footer>
        <span>One step at a time.</span>
        <button id="clear-completed" type="button">Clear completed</button>
      </footer>
    </section>
  </main>
</body>
</html>
